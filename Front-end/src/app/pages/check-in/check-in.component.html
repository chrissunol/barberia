<main class="checkin-page">
  @if (successMessage) {
    <div class="message success" role="status">✓ {{ successMessage }}</div>
  }

  <section class="checkin-card">
    <label class="language-picker">
      <span>{{ text.language }}</span>
      <select [ngModel]="language" (ngModelChange)="setLanguage($event)" [attr.aria-label]="text.language">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </label>

    <div class="brand-panel">
      <button class="brand-mark" type="button" (click)="onLogoTap()" [class.logo-tapped]="logoTapped"
        [attr.aria-label]="text.logoAction">
        <img src="assets/alibaba-barber.png" alt="Alibaba Barber" loading="eager">
      </button>
      <div class="intro">
        <p class="eyebrow">{{ text.barberShop }}</p>
        <h1>{{ text.welcome }}</h1>
        <p class="subtitle">{{ text.subtitle }}</p>
      </div>
    </div>

    <div class="form-panel">

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="name-grid">
          <label>
            <span>{{ text.firstName }}</span>
            <input type="text" formControlName="firstName" autocomplete="given-name" [placeholder]="text.firstNamePlaceholder">
            @if (form.controls.firstName.touched && form.controls.firstName.invalid) {
              <small>{{ text.firstNameError }}</small>
            }
          </label>

          <label>
            <span>{{ text.lastName }}</span>
            <input type="text" formControlName="lastName" autocomplete="family-name" [placeholder]="text.lastNamePlaceholder">
            @if (form.controls.lastName.touched && form.controls.lastName.invalid) {
              <small>{{ text.lastNameError }}</small>
            }
          </label>
        </div>

        <label>
          <span>{{ text.phone }}</span>
          <input type="tel" formControlName="phone" autocomplete="tel" inputmode="tel"
            [placeholder]="text.phonePlaceholder" (input)="formatPhone($event)">
          @if (form.controls.phone.touched && form.controls.phone.invalid) {
            <small>{{ text.phoneError }}</small>
          }
        </label>

        <label>
          <span>{{ text.email }}</span>
          <input type="email" formControlName="email" autocomplete="email" [placeholder]="text.emailPlaceholder">
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <small>{{ text.emailError }}</small>
          }
        </label>

        <label>
          <span>{{ text.howHeard }}</span>
          <select formControlName="howHeard">
            <option value="" disabled>{{ text.howHeardPlaceholder }}</option>
            @for (source of text.heardOptions; track source.value) {
              <option [value]="source.value">{{ source.label }}</option>
            }
          </select>
        </label>

        <div class="privacy-box">
          <p>{{ text.privacyNotice }}</p>
          <label class="consent-row">
            <input type="checkbox" formControlName="privacyConsent">
            <span>{{ text.privacyConsent }}</span>
          </label>
          @if (form.controls.privacyConsent.touched && form.controls.privacyConsent.invalid) {
            <small>{{ text.privacyError }}</small>
          }
        </div>

        <button type="submit" [disabled]="loading">
          {{ loading ? text.checkingIn : text.checkIn }}
        </button>

        @if (errorMessage) {
          <div class="message error" role="alert">{{ errorMessage }}</div>
        }
      </form>
    </div>
  </section>
</main>
